name: Compile MRS Ruleset

on:
  # Запуск вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:
  # Автоматический запуск каждые 24 часа
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download source domains
        run: |
          curl -sSL "https://raw.githubusercontent.com/Yularzhi/geosite_russia/main/data/category-ads-all" -o domains.txt

      - name: Install Mihomo (Clash Meta)
        run: |
          # Скачиваем последнюю версию mihomo для Linux
          MIHOMO_VERSION=$(curl -s "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Compile to MRS
        run: |
          echo "Starting compilation of domains.txt..."
          
          # Создаем минимальный валидный конфиг с отключенными портами
          cat <<EOF > config.yaml
          mixed-port: 0
          port: 0
          socks-port: 0
          allow-lan: false
          mode: rule
          log-level: silent
          EOF
          
          # Запускаем компиляцию, принудительно указав эту папку с конфигом
          mihomo -d . cli ruleset compile domains.txt -o category-ads-all.mrs
          
          echo "Compilation finished!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-mrs-ruleset
          path: category-ads-all.mrs

      # (Опционально) Публикация в релизы, чтобы была постоянная ссылка
      - name: Release MRS File
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: latest
          files: category-ads-all.mrs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
