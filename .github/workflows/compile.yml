name: Compile MRS Ruleset

on:
  # Запуск вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:
  # Автоматический запуск каждые 24 часа
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download source domains
        run: |
          curl -sSL "https://raw.githubusercontent.com/Yularzhi/geosite_russia/main/data/category-ads-all" -o domains.txt

      - name: Install Official Mihomo
        run: |
          # Скачиваем официальный релиз напрямую из репозитория MetaCubeX/mihomo
          curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.9/mihomo-linux-amd64-v1.18.9.gz" -o coupons.gz
          gunzip coupons.gz
          chmod +x coupons
          sudo mv coupons /usr/local/bin/mihomo

      - name: Compile to MRS
        run: |
          echo "Starting compilation..."
          
          # Мы перенаправляем пустой ввод в команду. 
          # Это предотвращает переход Mihomo в интерактивный режим ожидания сети.
          mihomo cli ruleset compile domains.txt -o category-ads-all.mrs < /dev/null
          
          echo "Compilation finished!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-mrs-ruleset
          path: category-ads-all.mrs

      # (Опционально) Публикация в релизы, чтобы была постоянная ссылка
      - name: Release MRS File
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: latest
          files: category-ads-all.mrs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
