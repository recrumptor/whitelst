name: Compile MRS Ruleset

on:
  # Запуск вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:
  # Автоматический запуск каждые 24 часа
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download source domains
        run: |
          curl -sSL "https://raw.githubusercontent.com/Yularzhi/geosite_russia/main/data/category-ads-all" -o domains.txt

      - name: Install Ruleset Compiler
        run: |
          # Скачиваем официальный легкий компилятор правил от MetaCubeX
          curl -sSL "https://github.com/MetaCubeX/metacubexraw/releases/download/v0.0.3/metacubexraw-linux-amd64" -o compiler
          chmod +x compiler
          sudo mv compiler /usr/local/bin/metacubexraw
          echo "Compiler installed!"

      - name: Compile to MRS
        run: |
          echo "Starting compilation of domains.txt..."
          
          # Компилируем напрямую через легкую утилиту
          metacubexraw ruleset compile domains.txt -o category-ads-all.mrs
          
          echo "Compilation finished!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-mrs-ruleset
          path: category-ads-all.mrs

      # (Опционально) Публикация в релизы, чтобы была постоянная ссылка
      - name: Release MRS File
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: latest
          files: category-ads-all.mrs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
