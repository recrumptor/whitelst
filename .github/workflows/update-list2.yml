name: Update Gemini Clash Rules

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download and convert Geosite JSON to Clash YAML
      run: |
        curl -sL "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/google-gemini.json" -o gemini.json
        
        echo "payload:" > gemini.yaml
        
        jq -r '.rules[] | .domain[]? | "  - DOMAIN,\(.)"' gemini.json >> gemini.yaml
        jq -r '.rules[] | .domain_suffix[]? | "  - DOMAIN-SUFFIX,\(.)"' gemini.json >> gemini.yaml
        jq -r '.rules[] | .domain_keyword[]? | "  - DOMAIN-KEYWORD,\(.)"' gemini.json >> gemini.yaml
        
        rm gemini.json

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Силой добавляем файл и создаем коммит без проверок на разницу
        git add gemini.yaml
        git commit -m "chore: автоматическое обновление правил Gemini [$(date +'%Y-%m-%d')]" || echo "Нет изменений для коммита"
        git push origin HEAD:${{ github.ref_name }}
